services:
  - type: web
    name: buffer-dissobel-dashboard
    env: python
    buildCommand: pip install -r requirements.txt && python process_data.py && python generate_dashboard.py
    startCommand: gunicorn app:app
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GDRIVE_FOLDER_URL
        value: https://drive.google.com/drive/folders/1PASq_9Ctw405jREodldP4MITOayxsrdr
